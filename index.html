<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHOHK MOBILE</title>
<meta name="theme-color" content="#061131">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a1c;--panel:#0a1634;--panel2:#0d1d44;--line:rgba(70,140,255,.32);--line2:rgba(70,140,255,.18);
  --ink:#eaf2ff;--mute:#8fa6cf;--cyan:#38c8ff;--blue:#1f6fff;--green:#22d36b;--red:#ff3b4f;--gold:#f5b83a;--purple:#8b4dff;
  --glow:0 0 0 1px var(--line),0 0 18px rgba(31,111,255,.22) inset;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.35 Rubik,system-ui,sans-serif;color:var(--ink);background:
 radial-gradient(1200px 500px at 50% -120px,rgba(31,111,255,.35),transparent 70%),
 radial-gradient(800px 600px at 100% 100%,rgba(139,77,255,.15),transparent 70%),
 linear-gradient(180deg,#061131,#030817 60%);background-color:#030817;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:270px 1fr;grid-template-rows:auto 1fr auto;min-height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:8px 18px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,rgba(6,18,50,.9),rgba(4,10,28,.6))}
.app-name{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px;min-width:250px}
.app-name small{color:var(--mute);font-weight:500}
.logo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.logo .word{font-weight:900;font-style:italic;font-size:44px;line-height:1;letter-spacing:1px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.logo .w1{color:#fff;text-shadow:0 0 18px rgba(120,180,255,.6)}
.logo .w2{background:linear-gradient(180deg,#7fe3ff,#1aa3ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(56,200,255,.5))}
.logo .sub{margin-top:4px;font-weight:600;font-size:15px;letter-spacing:1.5px;color:#dbe8ff}
.logo .sub b{color:var(--cyan);margin:0 8px}
.phone-logo{width:54px;height:54px;filter:drop-shadow(0 0 10px var(--cyan))}
.clock{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;background:rgba(6,16,44,.8);overflow:hidden}
.clock div{display:flex;align-items:center;gap:10px;padding:10px 16px}
.clock div+div{border-left:1px solid var(--line2)}
.clock .t{font-size:30px;font-weight:600}
.clock .d{font-weight:600;font-size:17px}.clock .d small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.bell{position:relative;background:none;border:0;padding:6px}
.bell em{position:absolute;top:0;right:-2px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;display:grid;place-items:center}
.admin{display:flex;align-items:center;gap:6px;color:#dbe8ff}

.side{padding:14px 10px;border-right:1px solid var(--line2);background:linear-gradient(180deg,rgba(8,20,54,.7),rgba(4,10,28,.4));display:flex;flex-direction:column}
.side button{white-space:nowrap;display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line2);padding:12px 14px;font-size:17px;text-align:left;color:#dbe8ff;border-radius:0}
.side button svg.i{width:26px;height:26px}
.side button.on{background:linear-gradient(90deg,#1f6fff,#1a55d6);border-radius:10px;border-color:transparent;box-shadow:0 0 16px rgba(31,111,255,.55);color:#fff}
.side .promo{margin-top:auto;padding:16px 10px;text-align:right;font-weight:600;font-size:19px;line-height:1.35;color:#e6efff;position:relative}
.side .promo svg{position:absolute;left:4px;bottom:20px;width:120px;height:120px;filter:drop-shadow(0 0 14px rgba(139,77,255,.8))}
.side .badge{margin-left:auto;background:var(--red);color:#fff;font-size:12px;border-radius:10px;padding:1px 7px}

main{padding:14px;min-width:0}
.foot{grid-column:1/3;display:flex;align-items:center;gap:0;border-top:1px solid var(--line2);background:rgba(4,10,28,.9);font-size:15px}
.foot div{display:flex;align-items:center;gap:10px;padding:10px 22px;border-right:1px solid var(--line2)}
.foot div:first-child{font-weight:700;letter-spacing:.5px}
.foot div:last-child{margin-left:auto;border:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.off{background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:14px}
.sc{display:flex;align-items:center;gap:16px;border-radius:12px;padding:14px 18px;min-height:92px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%);pointer-events:none}
.sc svg.i{width:52px;height:52px;stroke-width:1.6}
.sc .k{font-size:16px;opacity:.95}.sc .v{font-size:24px;font-weight:700;white-space:nowrap}.sc .s{font-size:13px;opacity:.9}
.sc .up{color:#6dffa8}.sc .dn{color:#ffb3bb}
.c1{background:linear-gradient(135deg,#0d3fa8,#0a2a78);box-shadow:0 0 18px rgba(31,111,255,.45)}
.c2{background:linear-gradient(135deg,#0c7a3c,#075029);box-shadow:0 0 18px rgba(34,211,107,.35)}
.c3{background:linear-gradient(135deg,#5b27c9,#3a1690);box-shadow:0 0 18px rgba(139,77,255,.45)}
.c4{background:linear-gradient(135deg,#a86a08,#6e4304);box-shadow:0 0 18px rgba(245,184,58,.4)}
.c5{background:linear-gradient(135deg,#b81f33,#7a0f1e);box-shadow:0 0 18px rgba(255,59,79,.4)}
.c4 svg.i{color:#ffd36b}.c1 svg.i{color:#7fd3ff}.c2 svg.i{color:#7dffb0}

/* ---------- panels ---------- */
.pn{background:linear-gradient(180deg,rgba(13,30,72,.85),rgba(8,20,52,.85));border:1px solid var(--line);border-radius:12px;box-shadow:0 0 20px rgba(31,111,255,.12) inset;padding:12px;min-width:0}
.pn>h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:19px;font-weight:600}
.pn>h2 small{font-weight:400;color:var(--mute);font-size:15px}
.pn>h2 .r{margin-left:auto}
.g-pos{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:14px}
.g-bot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.srch{display:flex;gap:8px;margin-bottom:10px}
.srch label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:rgba(3,10,30,.7)}
.srch input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:10px 0;min-width:0}
.ibtn{border:1px solid var(--line);background:rgba(3,10,30,.7);border-radius:10px;width:46px;display:grid;place-items:center}
.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
.cat{border:1px solid var(--line);background:rgba(3,10,30,.6);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:#cfe0ff}
.cat.on{background:linear-gradient(180deg,#2a7cff,#1452d6);border-color:#4c95ff;color:#fff;box-shadow:0 0 14px rgba(31,111,255,.6)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-height:330px;overflow:auto;padding-right:2px}
.tile{position:relative;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(20,44,100,.7),rgba(6,16,44,.9));padding:8px 8px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:126px}
.tile .pic{height:56px;display:grid;place-items:center}
.tile .pic svg{width:50px;height:50px}
.tile .pic img{width:64px;height:56px;object-fit:contain;border-radius:6px}
.thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;display:block;background:#061230}
.thumb.svg{display:grid;place-items:center}.thumb.svg svg{width:30px;height:30px}
.phbox{display:flex;align-items:center;gap:12px;margin-top:6px}.phbox .pv{width:96px;height:96px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:#061230;flex:none}.phbox .pv img{width:100%;height:100%;object-fit:cover}.phbox .pv svg{width:60px;height:60px}
.upl{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.catph{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.catph>div{text-align:center;font-size:13px}.catph .pv{width:100%;aspect-ratio:1;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:#061230;margin-bottom:4px;position:relative}.catph .pv img{width:100%;height:100%;object-fit:cover}.catph .pv svg{width:60%;height:60%}
.tile .nm{font-weight:600;font-size:14px;line-height:1.15;margin-top:4px}
.tile .md{font-size:12px;color:#b9cbef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:4px}
.tile .pr{font-weight:700;font-size:14px}
.tile .q{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:rgba(34,211,107,.2);color:#7dffb0}
.tile .q.low{background:rgba(255,59,79,.25);color:#ff9aa5}
.tile.out{opacity:.45}
.plus{width:26px;height:26px;border-radius:6px;border:0;background:var(--green);color:#fff;font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 0 8px rgba(34,211,107,.6)}

table{width:100%;border-collapse:collapse}
th{font-weight:600;color:#dbe8ff;font-size:14px;padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;background:rgba(31,111,255,.08)}
td{padding:7px 6px;border-bottom:1px solid var(--line2);font-size:15px}
.n{text-align:right;font-variant-numeric:tabular-nums}.c{text-align:center}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp button{width:28px;height:26px;border-radius:5px;border:1px solid #4c7fd6;background:#1a3a7a;font-size:18px;line-height:1}
.stp input{width:38px;text-align:center;background:#071433;border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:3px 0;font:inherit}
.del{background:none;border:0;color:var(--red);padding:2px}
.cart-wrap{min-height:160px;max-height:240px;overflow:auto}
.sum{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:10px}
.sumbox{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:rgba(3,10,30,.5)}
.sumbox .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#cfe0ff}
.sumbox .r b{color:#fff}
.sumbox .tot{border-top:1px solid var(--line2);margin-top:6px;padding-top:8px;font-size:20px;font-weight:700;color:#fff}
.sumbox .tot b{color:var(--green);font-size:26px;text-shadow:0 0 10px rgba(34,211,107,.5)}
.disc{display:inline-flex;align-items:center;gap:6px}
.disc input{width:90px;background:#071433;border:1px solid var(--line);border-radius:6px;color:#fff;padding:3px 6px;font:inherit;text-align:right}
.pays{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}
.pay{border:1px solid var(--line);border-radius:10px;background:#11306e;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;min-width:84px}
.pay.on{box-shadow:0 0 0 2px #fff,0 0 14px rgba(255,255,255,.4)}
.pay.p0{background:linear-gradient(180deg,#14a755,#0b7a3c)}.pay.p1{background:linear-gradient(180deg,#2a7cff,#1452d6)}.pay.p2{background:linear-gradient(180deg,#2563eb,#173f9e)}.pay.p3{background:linear-gradient(180deg,#d9343f,#8f1420)}
.acts{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}
.big{border:0;border-radius:10px;padding:14px 10px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.big.ok{background:linear-gradient(180deg,#22c463,#118a43);box-shadow:0 0 18px rgba(34,211,107,.5)}
.big.no{background:linear-gradient(180deg,#e2343f,#a3121f);box-shadow:0 0 14px rgba(255,59,79,.4)}
.big:disabled{opacity:.45;box-shadow:none}

.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:0 6px 0 44px;position:relative;border-left:1px solid var(--line2);margin-left:0}
.bars .yl{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;color:#cfe0ff;width:40px;text-align:right}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:38px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#5a8dff,#2348d8);box-shadow:0 0 10px rgba(31,111,255,.5);min-height:2px}
.bar.today i{background:linear-gradient(180deg,#3cf08a,#0fa84e);box-shadow:0 0 12px rgba(34,211,107,.6)}
.bar span{font-size:12px;color:#cfe0ff}
.xl{display:flex;gap:14px;padding:4px 6px 0 44px}.xl span{flex:1;text-align:center;font-size:12px;color:#cfe0ff}
.top3 .it{display:flex;align-items:center;gap:14px;padding:9px 6px;border-bottom:1px solid var(--line2);font-size:17px}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#3a2600;flex:none}
.m1{background:radial-gradient(circle at 35% 30%,#ffe27a,#d99a08)}.m2{background:radial-gradient(circle at 35% 30%,#f2f5ff,#9aa6c2)}.m3{background:radial-gradient(circle at 35% 30%,#ffc28a,#c26716)}.m4{background:#2a3d6e;color:#cfe0ff}
.top3 .it b{margin-left:auto;font-weight:600}
.donut{display:flex;align-items:center;gap:22px;padding:6px}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:104px;height:104px;border-radius:50%;background:#0a1838;display:grid;place-items:center;text-align:center;font-size:15px}
.ring b{display:block;font-size:34px}
.leg div{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px}
.leg i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* ---------- lists / forms ---------- */
.list .row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line2)}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:14px}
.tt{font-weight:600}
.btn{border:1px solid #4c95ff;background:linear-gradient(180deg,#2a7cff,#1452d6);border-radius:9px;padding:9px 14px;font-weight:600;color:#fff;box-shadow:0 0 10px rgba(31,111,255,.4)}
.btn.g{border-color:#3cf08a;background:linear-gradient(180deg,#22c463,#118a43);box-shadow:0 0 10px rgba(34,211,107,.4)}
.btn.r{border-color:#ff6b78;background:linear-gradient(180deg,#e2343f,#a3121f);box-shadow:none}
.btn.o{background:rgba(3,10,30,.6);border-color:var(--line);box-shadow:none}
.btn.sm{padding:5px 10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:rgba(3,10,30,.6);border-radius:20px;padding:6px 14px;font-size:14px;color:#cfe0ff}
.chip.on{background:linear-gradient(180deg,#2a7cff,#1452d6);color:#fff;border-color:#4c95ff}
.pill{font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;white-space:nowrap}
.s0{background:rgba(160,175,210,.2);color:#cfd8ef}.s1{background:rgba(245,140,40,.2);color:#ffb35a}.s2{background:rgba(34,211,107,.2);color:#6dffa8}.s3{background:rgba(31,111,255,.2);color:#8fc0ff}
.qb{display:inline-block;min-width:40px;text-align:center;border-radius:7px;padding:3px 8px;font-weight:700;background:rgba(34,211,107,.18);color:#6dffa8}
.qb.low{background:rgba(255,59,79,.22);color:#ff9aa5}.qb.mid{background:rgba(245,184,58,.2);color:#ffd36b}
.alert{background:rgba(255,59,79,.15);border:1px solid rgba(255,59,79,.5);color:#ffb3bb;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:600;cursor:pointer}
.note{background:rgba(245,184,58,.12);border:1px solid rgba(245,184,58,.4);color:#ffd99a;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kv .pn .k{color:var(--mute);font-size:14px}.kv .pn .v{font-size:22px;font-weight:700;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.fi{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#061230;color:var(--ink);outline:0}
.fi:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,200,255,.15)}
select.fi option{background:#061230}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;background:rgba(0,4,16,.7);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex}
#sheet{width:100%;max-width:540px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0f2255,#091636);border:1px solid #3f7fff;border-radius:14px;box-shadow:0 0 40px rgba(31,111,255,.4);padding:18px}
#sheet h2{margin:0 0 6px;font-size:20px}
.mact{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.mact .btn{flex:1}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#0f2a66;border:1px solid #4c95ff;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;box-shadow:0 0 18px rgba(31,111,255,.5)}
#toast.show{opacity:1}
.mnav{display:none}
.cbar{display:none;position:fixed;left:10px;right:10px;bottom:76px;z-index:39;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:12px;border:0;background:linear-gradient(180deg,#22c463,#118a43);box-shadow:0 0 18px rgba(34,211,107,.55);font-weight:600;font-size:16px;color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#1d3a7a;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* model picker */
.mp .mpb{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}.mp .mpb .chip{padding:4px 11px;font-size:13px;flex:none}
.mps{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto}.mps:empty{display:none}
.mpo{border:1px solid var(--line);background:#0b1d48;border-radius:8px;padding:6px 10px;font-size:13px;color:#dbe8ff;transition:.15s}
.mpo:hover{border-color:var(--cyan);color:#fff}.mpo.on{background:linear-gradient(180deg,#22c463,#118a43);border-color:#3cf08a;color:#fff}
.mpgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;padding:2px}
.g-bot2{grid-template-columns:1fr 1fr;margin-top:14px}
.lowg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lowi{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,59,79,.35);background:rgba(255,59,79,.06);border-radius:10px;padding:6px 10px;cursor:pointer;transition:.15s}.lowi:hover{background:rgba(255,59,79,.14)}
.lowi .lpic{width:38px;height:38px;display:grid;place-items:center;flex:none}.lowi .lpic svg,.lowi .lpic img{width:36px;height:36px;object-fit:contain;border-radius:6px}.lowi b{display:block;font-size:14px}.lowi .mute{font-size:12px}
/* motion & polish */

function startSubs(){
  mode="db";render();
  const need={p:1,r:1,s:1,d:1,c:1,m:1};
  const t=setTimeout(()=>{if(Object.keys(need).length){mode="slow";render()}},10000);
  const ok=k=>{if(need[k]){delete need[k];if(!Object.keys(need).length){clearTimeout(t);mode="db";render()}}};
  const er=e=>{clearTimeout(t);mode="err";render();console.error(e)};
  const map=s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());return o};
  const cm=ym(new Date()),pm=prevMonth(cm);
  db.collection("products").onSnapshot(s=>{S.products=map(s);if(!s.metadata.fromCache)ok("p");render()},er);
  db.collection("repairs").onSnapshot(s=>{S.repairs=map(s);if(!s.metadata.fromCache)ok("r");render()},er);
  db.collection("debts").onSnapshot(s=>{S.debts=map(s);if(!s.metadata.fromCache)ok("d");render()},er);
  db.collection("sales").where("month","in",[pm,cm]).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=(d.data().items||[]));S.days=o;if(!s.metadata.fromCache)ok("s");render()},er);
  db.collection("cash").where("month","in",[pm,cm]).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=(d.data().items||[]));S.cash=o;if(!s.metadata.fromCache)ok("c");render()},er);
  db.doc("meta/settings").onSnapshot(s=>{S.meta=s.exists?s.data():{};if(!s.metadata.fromCache)ok("m");render()},er);
}

function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=rej;document.head.appendChild(e)})}
function fbCfg(){try{return JSON.parse(localStorage.getItem("fb_cfg")||"null")}catch(e){return null}}
function parseCfg(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)return null;let j=m[0].replace(/\/\/.*$/gm,"").replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_][\w]*)\s*:/g,'$1"$2":').replace(/,\s*}/g,"}");try{const o=JSON.parse(j);return o.apiKey&&o.projectId?o:null}catch(e){return null}}
async function initFirebase(){
  const cfg=fbCfg();if(!cfg)return null;
  try{
    const V="https://www.gstatic.com/firebasejs/10.12.2/";
    await loadScript(V+"firebase-app-compat.js");await loadScript(V+"firebase-auth-compat.js");await loadScript(V+"firebase-firestore-compat.js");
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    const u=await new Promise(r=>{const x=firebase.auth().onAuthStateChanged(v=>{x();r(v)})});
    if(!u){fbState="login";return null}
    fbUser=u;fbState="ok";
    const root=fs.collection("shops").doc(u.uid);
    return {collection:n=>root.collection(n),doc:p=>{const[c,i]=p.split("/");return root.collection(c).doc(i)}};
  }catch(e){console.error(e);fbState="error";return null}
}
async function fbLogin(create){

  const em=$("fb_em").value.trim(),pw=$("fb_pw").value;if(!em||pw.length<6){toast("Email ва камида 6 белгили пароль");return}

    if(!firebase.apps.length)firebase.initializeApp(cfg);
    if(create)await firebase.auth().createUserWithEmailAndPassword(em,pw);else await firebase.auth().signInWithEmailAndPassword(em,pw);

  }catch(e){toast("Хато: "+(e.code||e.message||e))}
}

function addCart(pid){
  const p=S.products[pid];if(!p)return;
  const l=ui.cart.find(x=>x.pid===pid);
  const inCart=l?l.qty:0;
  if(inCart+1>p.qty){toast("Омборда фақат "+p.qty+" та бор");return}
  if(l)l.qty++;else ui.cart.push({pid,name:(p.cat==="Стекло"||p.cat==="Чехол"?p.cat+" ":"")+((p.model||p.name)),full:p.name+(p.model?" — "+p.model:""),qty:1,price:num(p.price),cost:num(p.cost),cat:p.cat});
  render();
}
function cartQty(i,d){const l=ui.cart[i];if(!l)return;const p=l.pid&&S.products[l.pid];const n=l.qty+d;if(n<1)return;if(p&&n>p.qty){toast("Омборда фақат "+p.qty+" та бор");return}l.qty=n;render()}
function cartSet(i,v){const l=ui.cart[i];if(!l)return;let n=Math.max(1,Math.round(num(v)));const p=l.pid&&S.products[l.pid];if(p&&n>p.qty){n=p.qty;toast("Омборда фақат "+p.qty+" та бор")}l.qty=n;render()}
function cartPrice(i,v){const l=ui.cart[i];if(l){l.price=Math.max(0,num(v));render()}}
function cartDel(i){ui.cart.splice(i,1);render()}
function cartClear(){ui.cart=[];ui.disc=0;ui.pay=0;render()}
function cartTotal(){return ui.cart.reduce((s,l)=>s+l.qty*l.price,0)}
function checkout(){
  if(!ui.cart.length)return;
  const tot=cartTotal(),disc=Math.min(num(ui.disc),tot),pay=PAYS[ui.pay][0];
  if(ui.pay===3){
    if(!ui.debtor.name){debtorDlg();return}
  }
  const day=today(),sid=uid(),t=new Date().toTimeString().slice(0,5);
  const items=(S.days[day]||[]).slice();
  ui.cart.forEach(l=>items.push({id:uid(),sid,t,pid:l.pid||null,name:l.full||l.name,cat:l.cat,qty:l.qty,price:l.price,cost:l.cost,pay}));
  if(disc>0)items.push({id:uid(),sid,t,pid:null,name:"Чегирма",cat:"Чегирма",qty:1,price:-disc,cost:0,pay});
  saveDay(day,items);
  ui.cart.forEach(l=>{if(l.pid&&S.products[l.pid]){const p=S.products[l.pid];saveProduct({...p,qty:Math.max(0,p.qty-l.qty)})}});
  if(ui.pay===3){saveDebt({id:uid(),client:ui.debtor.name,phone:ui.debtor.phone,amount:tot-disc,paid:0,payments:[],date:day,what:ui.cart.map(l=>l.name+(l.qty>1?" ×"+l.qty:"")).join(", "),sid})}
  ui.cart=[];ui.disc=0;ui.pay=0;ui.debtor={name:"",phone:""};
  toast("Сотилди ✓  "+money(tot-disc));
}
function returnDlg(day,sid){
  const ls=(S.days[day]||[]).filter(x=>(x.sid||x.id)===sid&&x.qty>0&&x.cat!=="Чегирма");
  openM(`<h2>↩️ Возврат (қайтариш)</h2><div class="mute">${fmtDate(day)} ${ls[0]?ls[0].t:""} даги чек. Мижоз қайтарган товар сонини ёзинг.</div>
  <table style="margin-top:10px"><tr><th>Товар</th><th class="c">Сотилган</th><th class="c">Қайтарилади</th></tr>${ls.map((x,i)=>{const left=x.qty-(x.ret||0);return `<tr><td>${esc(x.name)}<div class="mute">${money(x.price)}</div></td><td class="c">${x.qty}${x.ret?`<div class="mute">қайтган: ${x.ret}</div>`:""}</td><td class="c">${left>0?`<input class="fi" style="width:70px;text-align:center;padding:6px" id="rt_${i}" inputmode="numeric" value="0" data-max="${left}">`:"—"}</td></tr>`}).join("")}</table>
  <label class="f">Сабаби</label><input class="fi" id="rt_why" placeholder="масалан: тўғри келмади, брак">
  <div class="mact"><button class="btn o" onclick="closeM()">Бекор</button><button class="btn r" onclick="doReturn('${day}','${sid}')">↩️ Возврат қилиш</button></div>`);
}
function doReturn(day,sid){
  const items=(S.days[day]||[]).map(x=>({...x}));const ls=items.filter(x=>(x.sid||x.id)===sid&&x.qty>0&&x.cat!=="Чегирма");
  const why=$("rt_why").value.trim();const rets=[];
  ls.forEach((x,i)=>{const el=$("rt_"+i);if(!el)return;const q=Math.min(Math.max(0,Math.round(num(el.value))),x.qty-(x.ret||0));if(q>0){x.ret=(x.ret||0)+q;rets.push([x,q])}});
  if(!rets.length){toast("Қайтариладиган сонни ёзинг");return}
  const td=today(),rsid=uid(),t=new Date().toTimeString().slice(0,5);
  if(day===td){rets.forEach(([x,q])=>items.push({id:uid(),sid:rsid,t,pid:x.pid,name:"↩️ "+x.name,cat:x.cat,qty:-q,price:x.price,cost:x.cost,pay:x.pay,isRet:1,of:sid,why}));saveDay(td,items)}
  else{saveDay(day,items);const ti=(S.days[td]||[]).slice();rets.forEach(([x,q])=>ti.push({id:uid(),sid:rsid,t,pid:x.pid,name:"↩️ "+x.name,cat:x.cat,qty:-q,price:x.price,cost:x.cost,pay:x.pay,isRet:1,of:sid,why}));saveDay(td,ti)}
  rets.forEach(([x,q])=>{if(x.pid&&S.products[x.pid]){const p=S.products[x.pid];saveProduct({...p,qty:p.qty+q})}});
  const refund=rets.reduce((a,[x,q])=>a+q*x.price,0);
  Object.values(S.debts).filter(d=>d.sid===sid).forEach(d=>saveDebt({...d,amount:Math.max(0,num(d.amount)-refund)}));
  closeM();toast("↩️ Возврат: "+money(refund)+" мижозга қайтарилсин");
}
function undoSale_unused(day,sid){
  const items=S.days[day]||[];const rm=items.filter(x=>(x.sid||x.id)===sid);
  saveDay(day,items.filter(x=>(x.sid||x.id)!==sid));
  rm.forEach(it=>{if(it.pid&&S.products[it.pid]){const p=S.products[it.pid];saveProduct({...p,qty:p.qty+it.qty})}});
  Object.values(S.debts).filter(d=>d.sid===sid).forEach(d=>del("debts",d.id));
  toast("Бекор қилинди");
}

function vLowPanel(){const l=plist().filter(p=>lvl(p)==="low");return `<section class="pn"><h2>⚠️ Олиб келиш керак <small>(${l.length})</small>${l.length?`<span class="r"><button class="btn o sm" onclick="copyLow()">📋 Нусха</button></span>`:""}</h2>${l.length?`<div class="lowg">${l.slice(0,12).map(p=>`<div class="lowi" onclick="recvDlg('${p.id}')"><span class="lpic">${photo(p)}</span><span class="grow"><b>${esc(p.model||p.name)}</b><span class="mute">${esc(p.cat)}</span></span><span class="qb low">${p.qty}</span></div>`).join("")}</div>`:`<div class="empty">Ҳаммаси етарли ✓</div>`}</section>`}
function vRecent(){const it=(S.days[today()]||[]).slice(-7).reverse();return `<section class="pn"><h2>🧾 Сўнгги сотувлар<span class="r"><button class="btn o sm" onclick="go('kassa')">Ҳаммаси ›</button></span></h2>${it.length?`<table>${it.map(x=>`<tr><td class="mute">${x.t}</td><td style="${x.isRet?"color:var(--red)":""}">${esc(x.name)}${Math.abs(x.qty)>1?" ×"+Math.abs(x.qty):""}</td><td class="n" style="${x.isRet?"color:var(--red)":""}">${money(lineSum(x))}</td></tr>`).join("")}</table>`:`<div class="empty">Бугун ҳали сотув йўқ</div>`}</section>`}
function vWeek(){
  const days=[];for(let i=6;i>=0;i--){const d=dayShift(-i);days.push([d,dayStats(d).s])}
  const mx=Math.max(100,...days.map(d=>d[1]));const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step)*step;
  const yl=[5,4,3,2,1,0].map(k=>Math.round(top*k/5).toLocaleString("ru-RU").replace(/,/g," "));
  return `<section class="pn"><h2>${ic("chart")} Савдо статистикаси <small>(7 кун)</small></h2>
   <div class="bars"><div class="yl">${yl.map(v=>`<span>${v}</span>`).join("")}</div>${days.map(([d,v],i)=>`<div class="bar ${i===6?"today":""}" title="${money(v)}"><i style="height:${Math.round(v/top*100)}%"></i></div>`).join("")}</div>
   <div class="xl">${days.map(([d])=>`<span>${d.slice(8)}.${d.slice(5,7)}</span>`).join("")}</div></section>`;
}
function vTop(){
  const m=ym(new Date());const by={};salesOf(m).forEach(x=>{if(x.cat==="Чегирма"||x.cat==="Хизмат")return;by[x.name]=(by[x.name]||0)+x.qty});
  const t=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4);
  return `<section class="pn top3"><h2>${ic("trophy")} Топ товарлар <small>(сотув бўйича, шу ой)</small></h2>${t.length?t.map(([n,q],i)=>`<div class="it"><span class="medal m${i+1}">${i+1}</span><span>${esc(n)}</span><b>${q} дона</b></div>`).join(""):`<div class="empty">Ҳали сотув йўқ</div>`}</section>`;
}
function vRingPanel(){
  const r=Object.values(S.repairs).filter(x=>x.status<3);const n=r.length;const a=r.filter(x=>x.status===2).length,b=r.filter(x=>x.status===1).length,c=r.filter(x=>x.status===0).length;
  const P=v=>n?Math.round(v/n*100):0;const pa=P(a),pb=P(b);
  const bg=n?`conic-gradient(#22d36b 0 ${pa}%,#ff9b2f ${pa}% ${pa+pb}%,#c5cde0 ${pa+pb}% 100%)`:"conic-gradient(#1d2f5e 0 100%)";
  return `<section class="pn"><h2>${ic("tools")} Ремонтлар ҳолати</h2><div class="donut"><div class="ring" style="background:${bg};box-shadow:0 0 18px rgba(34,211,107,.35)"><div><span>Жами<b>${n}</b></span></div></div>
   <div class="leg"><div><i style="background:#22d36b"></i>Тайёр — ${a} (${pa}%)</div><div><i style="background:#ff9b2f"></i>Жараёнда — ${b} (${pb}%)</div><div><i style="background:#c5cde0"></i>Кутилмоқда — ${c} (${n?100-pa-pb:0}%)</div></div></div></section>`;
}

/* ---------- kassa ---------- */
function vKassa(){
  const day=today();
  const all=[];Object.keys(S.days).sort().forEach(d=>{const gr={};(S.days[d]||[]).forEach(x=>{const k=x.sid||x.id;(gr[k]=gr[k]||[]).push(x)});Object.entries(gr).forEach(([sid,ls])=>all.push({day:d,sid,ls}))});
  all.reverse();const hq=(ui.hq||"").trim().toLowerCase();
  const scope=ui.hist==="all"?all:all.filter(c=>c.day===day);
  const g=(hq?scope.filter(c=>c.ls.some(x=>String(x.name).toLowerCase().includes(hq))):scope).slice(0,150);
  return vPOS()+`<section class="pn"><h2>${ic("cash")} Чеклар тарихи<span class="r chips" style="margin:0"><button class="chip ${ui.hist!=="all"?"on":""}" onclick="ui.hist='today';render()">Бугун</button><button class="chip ${ui.hist==="all"?"on":""}" onclick="ui.hist='all';render()">2 ойлик</button></span></h2>
  <div class="srch"><label>${ic("search")}<input id="q_hist" placeholder="Чекдан товар қидириш" value="${esc(ui.hq||"")}" oninput="ui.hq=this.value;render()"></label></div>
  <div class="mute" style="margin-bottom:8px">🔒 Сотилган чекни ўчириб бўлмайди. Мижоз товарни қайтарса — «Возврат» тугмасини босинг.</div>
  ${g.length?`<div style="overflow-x:auto"><table><tr><th>Сана</th><th>Товарлар</th><th>Тўлов</th><th class="n">Сумма</th><th></th></tr>${g.map(({day:d,sid,ls})=>{const isR=ls.some(x=>x.isRet);const canR=!isR&&ls.some(x=>x.qty>0&&x.cat!=="Чегирма"&&x.qty>(x.ret||0));const retd=ls.some(x=>x.ret);return `<tr style="${isR?"background:rgba(255,59,79,.08)":""}"><td>${d===day?"":fmtDate(d).slice(0,5)+" "}${ls[0].t}</td><td>${ls.map(x=>esc(x.name)+(Math.abs(x.qty)>1?" ×"+Math.abs(x.qty):"")+(x.ret?` <span class="pill s1">қайтди ${x.ret}</span>`:"")).join(", ")}${isR&&ls[0].why?`<div class="mute">Сабаб: ${esc(ls[0].why)}</div>`:""}</td><td>${isR?`<span class="pill" style="background:rgba(255,59,79,.2);color:#ff9aa5">Возврат</span>`:esc(ls[0].pay||"Нақд")}</td><td class="n" style="${isR?"color:var(--red)":""}">${money(ls.reduce((a,x)=>a+lineSum(x),0))}</td><td class="c">${canR?`<button class="btn o sm" onclick="returnDlg('${d}','${sid}')">↩️ Возврат</button>`:retd&&!canR?`<span class="mute">тўлиқ қайтган</span>`:""}</td></tr>`}).join("")}</table></div>`:`<div class="empty">${ui.hist==="all"?"Чек йўқ":"Бугун ҳали сотув йўқ"}</div>`}</section>`;
}

/* ---------- stock ---------- */
function vStock(){
  const all=plist();const lows=all.filter(p=>lvl(p)==="low");
  let list=ui.cat==="all"||ui.cat==="more"?all:all.filter(p=>p.cat===ui.cat);
  if(ui.low)list=list.filter(p=>lvl(p)==="low");
  const qq=ui.q.trim().toLowerCase();if(qq)list=list.filter(p=>match(p,qq));
  const val=all.reduce((a,p)=>a+p.qty*num(p.cost),0),sval=all.reduce((a,p)=>a+p.qty*num(p.price),0);
  let h=`<div class="kv"><div class="pn"><div class="k">Товар хиллари</div><div class="v">${all.length}</div></div><div class="pn"><div class="k">Жами дона</div><div class="v">${all.reduce((a,p)=>a+p.qty,0)}</div></div><div class="pn"><div class="k">Олиш нархида</div><div class="v">${money(val)}</div></div><div class="pn"><div class="k">Сотиш нархида</div><div class="v">${money(sval)}</div></div></div>`;
  if(lows.length)h+=`<div class="alert" onclick="ui.low=!ui.low;render()">⚠️ ${lows.length} та товар кам қолди — ${ui.low?"ҳаммасини кўрсатиш":"фақат шуларни кўриш"}</div>`;
  h+=`<section class="pn"><h2>${ic("box")} Товарлар (Омбор)<span class="r" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="bulkDlg()">⚡ Кўп моделга бирданига</button><button class="btn g" onclick="editProduct()">+ Янги товар</button></span></h2>
  <div class="srch"><label>${ic("search")}<input id="q_st" placeholder="Модел, ном ёки штрих-код" value="${esc(ui.q)}" oninput="ui.q=this.value;render()"></label></div>
  <div class="chips"><button class="chip ${ui.cat==="all"||ui.cat==="more"?"on":""}" onclick="ui.cat='all';render()">Барчаси ${all.length}</button>${CATS.map(c=>`<button class="chip ${ui.cat===c?"on":""}" onclick="ui.cat='${c}';render()">${c} ${all.filter(p=>p.cat===c).length}</button>`).join("")}</div>`;
  if(!list.length)return h+`<div class="empty">${all.length?"Топилмади":"Ҳали товар йўқ. «+ Янги товар» ни босинг."}</div></section>`;
  h+=`<div style="overflow-x:auto"><table><tr><th>Расм</th><th>Модел / Номи</th><th class="n">Олиш</th><th class="n">Сотиш</th><th class="c">Қолди</th><th class="c">Кирим</th><th></th></tr>${list.map(p=>`<tr><td>${thumb(p)}</td><td onclick="editProduct('${p.id}')" style="cursor:pointer"><b>${esc(p.model||p.name)}</b><div class="mute">${esc(p.cat)}${p.model&&p.name!==p.cat?" · "+esc(p.name):""}</div></td><td class="n">${Math.round(num(p.cost))}</td><td class="n">${Math.round(num(p.price))}</td><td class="c"><span class="qb ${lvl(p)}">${p.qty}</span></td><td class="c"><span class="stp"><button onclick="adj('${p.id}',-1)">−</button><button onclick="adj('${p.id}',1)">+</button><button style="width:auto;padding:0 8px;font-size:13px" onclick="recvDlg('${p.id}')">📥</button></span></td><td class="c"><button class="del" style="color:#8fc0ff" onclick="editProduct('${p.id}')">${ic("pen")}</button></td></tr>`).join("")}</table></div></section>`;
  return h;
}

function submitProduct(id){
  const name=$("f_name").value.trim(),model=$("f_model").value.trim();
  if(!name&&!model){toast("Ном ёки моделни ёзинг");return}
  const old=id?S.products[id]:{};
  saveProduct({...old,id:id||uid(),cat:$("f_cat").value,name:name||$("f_cat").value,model,cost:num($("f_cost").value),price:num($("f_price").value),qty:Math.max(0,Math.round(num($("f_qty").value))),min:Math.max(0,Math.round(num($("f_min").value))),code:$("f_code").value.trim(),img:window._img||""});
  closeM();toast("Сақланди ✓");
}

/* ---------- repairs ---------- */
function vRepair(){
  const all=Object.values(S.repairs).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))||String(b.id).localeCompare(String(a.id)));
  const groups={active:all.filter(r=>r.status<3),ready:all.filter(r=>r.status===2),done:all.filter(r=>r.status===3),all};
  let list=groups[ui.rf];const qq=ui.q.trim().toLowerCase();
  if(qq)list=list.filter(r=>(r.client+" "+r.phone+" "+r.device+" "+r.issue).toLowerCase().includes(qq));
  let h=`<div class="g2" style="margin-bottom:14px">${vRingPanel()}<section class="pn"><h2>${ic("coins")} Шу ой ремонтдан</h2>${(()=>{const m=ym(new Date());const d=all.filter(r=>r.status===3&&String(r.givenAt||"").startsWith(m));const s=d.reduce((a,r)=>a+num(r.price),0),p=d.reduce((a,r)=>a+num(r.price)-num(r.parts),0);return `<div class="kv" style="grid-template-columns:1fr 1fr 1fr;margin:0"><div><div class="mute">Берилди</div><div style="font-size:24px;font-weight:700">${d.length} та</div></div><div><div class="mute">Тушум</div><div style="font-size:22px;font-weight:700">${money(s)}</div></div><div><div class="mute">Фойда</div><div style="font-size:22px;font-weight:700;color:var(--green)">${money(p)}</div></div></div>`})()}</section></div>`;
  h+=`<section class="pn"><h2>${ic("tools")} Ремонт (Сервис)<span class="r"><button class="btn g" onclick="editRepair()">+ Қабул қилиш</button></span></h2>
  <div class="srch"><label>${ic("search")}<input id="q_rp" placeholder="Мижоз, рақам, модел…" value="${esc(ui.q)}" oninput="ui.q=this.value;render()"></label></div>
  <div class="chips">${[["active","Жараёнда"],["ready","Тайёр"],["done","Берилган"],["all","Ҳаммаси"]].map(([k,n])=>`<button class="chip ${ui.rf===k?"on":""}" onclick="ui.rf='${k}';render()">${n} ${groups[k].length}</button>`).join("")}</div>`;
  if(!list.length)return h+`<div class="empty">Ремонт йўқ</div></section>`;
  h+=`<div class="list">${list.map(r=>{const debt=num(r.price)-num(r.prepaid);return `<div class="row" onclick="editRepair('${r.id}')" style="cursor:pointer"><div style="width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:rgba(139,77,255,.2);color:#c7a8ff">${ic("phone")}</div><div class="grow"><div class="tt">${esc(r.device)} — <span style="font-weight:400">${esc(r.issue)}</span></div><div class="mute">${esc(r.client)} ${r.phone?"· "+esc(r.phone):""} · ${fmtDate(r.createdAt)}</div></div><div style="text-align:right"><span class="pill s${r.status}">${RST[r.status]}</span><div style="margin-top:4px;font-weight:600">${money(num(r.price))}</div>${r.status<3&&num(r.prepaid)?`<div class="mute">қолди ${money(debt)}</div>`:""}</div></div>`}).join("")}</div></section>`;
  return h;
}

  ${id?`<div class="chips" style="margin-top:8px">${RST.map((s,i)=>`<button class="chip ${r.status===i?"on":""}" onclick="setStatus('${id}',${i})">${s}</button>`).join("")}</div>`:""}

  <div class="two"><div><label class="f">Мижоз исми</label><input class="fi" id="r_c" value="${esc(r.client)}"></div><div><label class="f">Мижоз рақами</label><input class="fi" id="r_ph" type="tel" value="${esc(r.phone)}"></div></div>

function readRepair(id){const old=id?S.repairs[id]:{status:0,createdAt:today()};return {...old,id:id||uid(),device:$("r_d").value.trim(),issue:$("r_i").value.trim(),client:$("r_c").value.trim(),phone:$("r_ph").value.trim(),price:num($("r_p").value),prepaid:num($("r_pp").value),parts:num($("r_pa").value),note:$("r_n").value.trim()}}
function submitRepair(id){const r=readRepair(id);if(!r.device){toast("Моделни ёзинг");return}saveRepair(r);closeM();toast("Сақланди ✓")}
function setStatus(id,i){const r=readRepair(id);r.status=i;r.givenAt=i===3?(r.givenAt||today()):null;saveRepair(r);editRepair(id);toast(RST[i])}

/* ---------- clients ---------- */
function clientList(){
  const m={};const key=(n,p)=>(p||"").replace(/\D/g,"")||("n:"+String(n||"").toLowerCase());
  Object.values(S.repairs).forEach(r=>{if(!r.client&&!r.phone)return;const k=key(r.client,r.phone);const c=m[k]||(m[k]={name:r.client,phone:r.phone,rep:0,spent:0,debt:0,last:""});c.rep++;if(r.status===3)c.spent+=num(r.price);if(r.createdAt>c.last)c.last=r.createdAt;if(!c.name)c.name=r.client});
  Object.values(S.debts).forEach(d=>{const k=key(d.client,d.phone);const c=m[k]||(m[k]={name:d.client,phone:d.phone,rep:0,spent:0,debt:0,last:""});c.debt+=Math.max(0,num(d.amount)-num(d.paid));c.spent+=num(d.paid);if(d.date>c.last)c.last=d.date;if(!c.phone)c.phone=d.phone});
  return Object.values(m).sort((a,b)=>String(b.last).localeCompare(String(a.last)));
}
function vClients(){
  let l=clientList();const qq=ui.q.trim().toLowerCase();if(qq)l=l.filter(c=>(c.name+" "+c.phone).toLowerCase().includes(qq));
  return `<section class="pn"><h2>${ic("users")} Мижозлар <small>(ремонт ва қарзлардан ўзи йиғилади)</small></h2>
  <div class="srch"><label>${ic("search")}<input id="q_cl" placeholder="Исм ёки рақам" value="${esc(ui.q)}" oninput="ui.q=this.value;render()"></label></div>
  ${l.length?`<div style="overflow-x:auto"><table><tr><th>Исм</th><th>Рақам</th><th class="c">Ремонт</th><th class="n">Тўлаган</th><th class="n">Қарзи</th><th>Охирги</th></tr>${l.map(c=>`<tr><td><b>${esc(c.name||"—")}</b></td><td>${esc(c.phone||"")}</td><td class="c">${c.rep}</td><td class="n">${money(c.spent)}</td><td class="n" style="color:${c.debt?"var(--red)":"inherit"}">${c.debt?money(c.debt):"—"}</td><td>${fmtDate(c.last)}</td></tr>`).join("")}</table></div>`:`<div class="empty">Ҳали мижоз йўқ. Ремонт қабул қилганда ёки қарзга сотганда шу ерга тушади.</div>`}</section>`;
}

/* ---------- debts ---------- */
function vDebts(){
  const all=Object.values(S.debts).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const open=all.filter(d=>num(d.amount)-num(d.paid)>0),closed=all.filter(d=>num(d.amount)-num(d.paid)<=0);
  const tot=open.reduce((a,d)=>a+num(d.amount)-num(d.paid),0);
  const row=d=>{const rest=num(d.amount)-num(d.paid);return `<div class="row"><div style="width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:rgba(255,59,79,.18);color:#ff9aa5">${ic("users")}</div><div class="grow"><div class="tt">${esc(d.client)} ${d.phone?`<span class="mute">· ${esc(d.phone)}</span>`:""}</div><div class="mute">${fmtDate(d.date)} · ${esc(d.what||"")}</div>${(d.payments||[]).length?`<div class="mute">Тўловлар: ${(d.payments||[]).map(p=>fmtDate(p.date)+" — "+money(p.amount)).join("; ")}</div>`:""}</div><div style="text-align:right"><div style="font-weight:700;color:${rest>0?"var(--red)":"var(--green)"}">${rest>0?money(rest):"Ёпилди ✓"}</div><div class="mute">жами ${money(num(d.amount))}</div><div style="margin-top:6px;display:flex;gap:6px;justify-content:flex-end">${rest>0?`<button class="btn g sm" onclick="payDebt('${d.id}')">Тўлади</button>`:""}<button class="btn o sm" onclick="confirmDlg('Бу қарзни ўчирасизми?',()=>del('debts','${d.id}'))">${ic("trash")}</button></div></div></div>`};
  return `<div class="kv"><div class="pn"><div class="k">Жами қарздорлик</div><div class="v" style="color:var(--red)">${money(tot)}</div></div><div class="pn"><div class="k">Қарздорлар</div><div class="v">${open.length} киши</div></div></div>
  <section class="pn"><h2>${ic("debt")} Қарзлар<span class="r"><button class="btn g" onclick="newDebt()">+ Қарз ёзиш</button></span></h2>
  <div class="mute" style="margin-bottom:8px">Кассада «Қарзга» тўловини танласангиз, қарз шу ерга ўзи тушади.</div>
  ${open.length?`<div class="list">${open.map(row).join("")}</div>`:`<div class="empty">Ҳеч ким қарз эмас ✓</div>`}
  ${closed.length?`<h2 style="margin-top:16px;font-size:16px">Ёпилган қарзлар (${closed.length})</h2><div class="list">${closed.slice(0,30).map(row).join("")}</div>`:""}</section>`;
}
function payDebt(id){const d=S.debts[id];const rest=num(d.amount)-num(d.paid);openM(`<h2>Қарз тўлови</h2><div class="mute">${esc(d.client)} — қолди ${money(rest)}</div><label class="f">Қанча тўлади</label><input class="fi" id="pd_v" inputmode="decimal" value="${rest}"><div class="mact"><button class="btn o" onclick="closeM()">Бекор</button><button class="btn g" onclick="doPay('${id}')">Сақлаш</button></div>`);setTimeout(()=>$("pd_v").select(),50)}
function doPay(id){const d=S.debts[id];const v=num($("pd_v").value);if(v<=0){toast("Суммани ёзинг");return}saveDebt({...d,paid:num(d.paid)+v,payments:[...(d.payments||[]),{date:today(),amount:v}]});closeM();toast("Тўлов сақланди ✓")}
function newDebt(){openM(`<h2>Қарз ёзиш</h2><label class="f">Мижоз исми</label><input class="fi" id="nd_n" list="cl2"><datalist id="cl2">${clientList().map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist><label class="f">Рақами</label><input class="fi" id="nd_p" type="tel"><label class="f">Сумма</label><input class="fi" id="nd_a" inputmode="decimal"><label class="f">Нима учун</label><input class="fi" id="nd_w" placeholder="масалан: экран алмаштириш"><div class="mact"><button class="btn o" onclick="closeM()">Бекор</button><button class="btn g" onclick="doNewDebt()">Сақлаш</button></div>`);setTimeout(()=>$("nd_n").focus(),50)}
function doNewDebt(){const n=$("nd_n").value.trim(),a=num($("nd_a").value);if(!n||a<=0){toast("Исм ва суммани ёзинг");return}saveDebt({id:uid(),client:n,phone:$("nd_p").value.trim(),amount:a,paid:0,payments:[],date:today(),what:$("nd_w").value.trim()});closeM();toast("Сақланди ✓")}

/* ---------- cash in/out ---------- */
function vCash(){
  const m=ym(new Date());const items=cashOf(m).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const inn=items.filter(x=>x.type==="in").reduce((a,x)=>a+num(x.amount),0),out=items.filter(x=>x.type==="out").reduce((a,x)=>a+num(x.amount),0);
  return `<div class="kv"><div class="pn"><div class="k">Шу ой кирим</div><div class="v" style="color:var(--green)">${money(inn)}</div></div><div class="pn"><div class="k">Шу ой чиқим</div><div class="v" style="color:var(--red)">${money(out)}</div></div></div>
  <section class="pn"><h2>${ic("swap")} Кирим-чиқим <small>${monthName(m)}</small><span class="r" style="display:flex;gap:8px"><button class="btn g sm" onclick="cashDlg('in')">+ Кирим</button><button class="btn r sm" onclick="cashDlg('out')">− Чиқим</button></span></h2>
  <div class="mute" style="margin-bottom:8px">Чиқим: ижара, свет, товар олиб келиш йўл кира, овқат… Кирим: савдодан ташқари тушган пул. Чиқимлар ҳисоботда фойдадан айрилади.</div>
  ${items.length?`<table><tr><th>Сана</th><th>Изоҳ</th><th class="n">Сумма</th><th></th></tr>${items.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.note)}</td><td class="n" style="color:${x.type==="in"?"var(--green)":"var(--red)"}">${x.type==="in"?"+":"−"}${money(num(x.amount))}</td><td class="c"><button class="del" onclick="confirmDlg('Ўчирасизми?',()=>delCash('${m}','${x.id}'))">${ic("trash")}</button></td></tr>`).join("")}</table>`:`<div class="empty">Бу ойда ёзув йўқ</div>`}</section>`;
}
function cashDlg(type){openM(`<h2>${type==="in"?"Кирим":"Чиқим"}</h2><label class="f">Сумма</label><input class="fi" id="cs_a" inputmode="decimal"><label class="f">Изоҳ</label><input class="fi" id="cs_n" placeholder="${type==="in"?"масалан: эски телефон сотилди":"масалан: ижара, свет"}"><div class="mact"><button class="btn o" onclick="closeM()">Бекор</button><button class="btn ${type==="in"?"g":"r"}" onclick="doCash('${type}')">Сақлаш</button></div>`);setTimeout(()=>$("cs_a").focus(),50)}
function doCash(type){const a=num($("cs_a").value);if(a<=0){toast("Суммани ёзинг");return}const m=ym(new Date());saveCash(m,[...cashOf(m),{id:uid(),date:today(),type,amount:a,note:$("cs_n").value.trim()}]);closeM();toast("Сақланди ✓")}
function delCash(m,id){saveCash(m,cashOf(m).filter(x=>x.id!==id))}

/* ---------- report ---------- */
function vReport(){
  const m=ui.rMonth,isCur=m===ym(new Date());const items=salesOf(m);
  const rev=items.reduce((a,x)=>a+lineSum(x),0),cost=items.reduce((a,x)=>a+x.qty*x.cost,0);
  const reps=Object.values(S.repairs).filter(r=>r.status===3&&String(r.givenAt||"").startsWith(m));
  const rrev=reps.reduce((a,r)=>a+num(r.price),0),rcost=reps.reduce((a,r)=>a+num(r.parts),0);
  const cs=cashOf(m);const cin=cs.filter(x=>x.type==="in").reduce((a,x)=>a+num(x.amount),0),cout=cs.filter(x=>x.type==="out").reduce((a,x)=>a+num(x.amount),0);
  const net=rev-cost+rrev-rcost+cin-cout;
  const byCat={};items.forEach(x=>{const c=byCat[x.cat]||(byCat[x.cat]={q:0,s:0,p:0});c.q+=x.qty;c.s+=lineSum(x);c.p+=x.qty*(x.price-x.cost)});
  const byPay={};items.forEach(x=>{const k=x.pay||"Нақд";byPay[k]=(byPay[k]||0)+lineSum(x)});
  const byP={};items.forEach(x=>{if(x.cat==="Чегирма")return;const c=byP[x.name]||(byP[x.name]={q:0,s:0});c.q+=x.qty;c.s+=lineSum(x)});
  const top=Object.entries(byP).sort((a,b)=>b[1].q-a[1].q).slice(0,10);
  return `<div class="pn" style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button class="btn o" onclick="setRM('${prevMonth(m)}')">‹</button><div class="grow" style="text-align:center;font-size:20px;font-weight:600">${monthName(m)}</div><button class="btn o" onclick="setRM('${nextMonth(m)}')" ${isCur?"disabled style='opacity:.3'":""}>›</button></div>
  <div class="kv"><div class="pn"><div class="k">Товар савдоси</div><div class="v">${money(rev)}</div></div><div class="pn"><div class="k">Товар фойдаси</div><div class="v">${money(rev-cost)}</div></div><div class="pn"><div class="k">Ремонт (${reps.length} та)</div><div class="v">${money(rrev)}</div></div><div class="pn"><div class="k">Ремонт фойдаси</div><div class="v">${money(rrev-rcost)}</div></div>
  <div class="pn"><div class="k">Бошқа кирим</div><div class="v" style="color:var(--green)">${money(cin)}</div></div><div class="pn"><div class="k">Чиқимлар</div><div class="v" style="color:var(--red)">${money(cout)}</div></div><div class="pn" style="grid-column:span 2;background:linear-gradient(135deg,#0c7a3c,#075029);border-color:#3cf08a"><div class="k" style="color:#c9ffdd">СОФ ФОЙДА</div><div class="v" style="font-size:28px">${money(net)}</div></div></div>
  <div class="g2"><section class="pn"><h2>Категория бўйича</h2>${Object.keys(byCat).length?`<table><tr><th>Тур</th><th class="n">Дона</th><th class="n">Савдо</th><th class="n">Фойда</th></tr>${Object.entries(byCat).sort((a,b)=>b[1].s-a[1].s).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="n">${c==="Чегирма"?"":v.q}</td><td class="n">${money(v.s)}</td><td class="n">${money(v.p)}</td></tr>`).join("")}</table>`:`<div class="empty">Бу ойда савдо йўқ</div>`}
   ${Object.keys(byPay).length?`<h2 style="margin-top:14px;font-size:16px">Тўлов тури бўйича</h2><table>${Object.entries(byPay).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${money(v)}</td></tr>`).join("")}</table>`:""}</section>
  <section class="pn top3"><h2>${ic("trophy")} Энг кўп сотилганлар</h2>${top.length?top.map(([n,v],i)=>`<div class="it"><span class="medal ${i<3?"m"+(i+1):"m4"}">${i+1}</span><span>${esc(n)}</span><b>${v.q} дона · ${money(v.s)}</b></div>`).join(""):`<div class="empty">—</div>`}</section></div>`;
}
function setRM(m){ui.rMonth=m;subReportMonth();render()}

  <section class="pn"><h2>${ic("db")} Маълумотлар</h2><div class="mute">${mode==="local"?"📴 Ҳозир маълумотлар фақат шу қурилмада сақланмоқда.":"☁️ Маълумотлар интернетда сақланади — телефон ёки компьютер алмашса ҳам йўқолмайди. Саҳифани ёрдамчингиз билан бўлишсангиз, у ҳам касса қила олади."}</div>
   <div class="mact"><button class="btn" onclick="backup()">📋 Захира нусха олиш</button><button class="btn o" onclick="restoreDlg()">♻️ Захирадан тиклаш</button></div><div class="mute" style="margin-top:8px">Нусхани Telegram'да ўзингизга юбориб қўйинг.</div></section></div>`;
}
function backup(){navigator.clipboard.writeText(JSON.stringify({products:S.products,repairs:S.repairs,debts:S.debts,days:S.days,cash:S.cash})).then(()=>toast("Нусхаланди"),()=>toast("Нусхалаб бўлмади"))}
function helpDlg(){openM(`<h2>Ёрдам</h2><div style="line-height:1.6">
 • <b>Касса:</b> товар расмига босинг → чекка тушади → тўлов турини танланг → «Сотишни тасдиқлаш».<br>
 • <b>Омбор:</b> «Энг кам миқдор» дан кам қолса, товар қизил бўлади ва тепадаги қўнғироқчада чиқади.<br>
 • <b>Ремонт:</b> қабул қилинг, ҳолатини ўзгартиринг. «Берилди» бўлганда пул ҳисоботга тушади.<br>
 • <b>Қарзга:</b> кассада «Қарзга» танланса, «Қарзлар»га ўзи ёзилади.<br>
 • <b>Компьютерда:</b> F9 — сотишни тасдиқлаш, сканер штрих-кодни қидирув қаторига ёзади.</div><div class="mact"><button class="btn" onclick="closeM()">Тушундим</button></div>`)}

/* ---------- dialogs ---------- */
function openM(html){$("sheet").innerHTML=html;$("modal").classList.add("open")}
function closeM(){$("modal").classList.remove("open")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});
function confirmDlg(text,fn){window._cf=fn;openM(`<h2>Тасдиқлаш</h2><p>${esc(text)}</p><div class="mact"><button class="btn o" onclick="closeM()">Йўқ</button><button class="btn r" onclick="closeM();_cf()">Ҳа</button></div>`)}
document.addEventListener("keydown",e=>{if(e.key==="F9"){e.preventDefault();if(!$("modal").classList.contains("open"))checkout()}if(e.key==="Escape")closeM()});

init();
</script>
